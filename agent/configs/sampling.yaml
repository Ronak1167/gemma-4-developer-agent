# Realized sampling configuration: 8192 output headroom with 2048 thinking budget
# for gemma-4-31b — larger model benefits from deeper per-turn reasoning.
# Thoughts are stripped between turns (include_thoughts: false) to prevent ballooning.
temperature: 0.1
top_p: 0.95
max_output_tokens: 8192
thinking_config:
  thinking_budget: 2048
  include_thoughts: false
